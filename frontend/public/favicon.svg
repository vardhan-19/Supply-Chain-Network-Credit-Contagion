<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Dark background circle -->
  <circle cx="24" cy="24" r="24" fill="#0f172a"/>

  <!-- Edges / connections -->
  <!-- hub → top-right -->
  <line x1="24" y1="24" x2="36" y2="12" stroke="#1a56db" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- hub → right -->
  <line x1="24" y1="24" x2="39" y2="26" stroke="#1a56db" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- hub → bottom -->
  <line x1="24" y1="24" x2="26" y2="38" stroke="#1a56db" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- hub → bottom-left -->
  <line x1="24" y1="24" x2="12" y2="36" stroke="#1a56db" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- hub → left -->
  <line x1="24" y1="24" x2="9" y2="22" stroke="#1a56db" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- hub → top-left -->
  <line x1="24" y1="24" x2="14" y2="11" stroke="#1a56db" stroke-width="1.8" stroke-opacity="0.7"/>
  <!-- peripheral edge: top-right → right -->
  <line x1="36" y1="12" x2="39" y2="26" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.45"/>
  <!-- peripheral edge: bottom-left → left -->
  <line x1="12" y1="36" x2="9" y2="22" stroke="#2563eb" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Satellite nodes -->
  <circle cx="36" cy="12" r="3.5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="39" cy="26" r="3"   fill="#60a5fa" opacity="0.85"/>
  <circle cx="26" cy="38" r="3"   fill="#60a5fa" opacity="0.85"/>
  <circle cx="12" cy="36" r="3.5" fill="#3b82f6" opacity="0.9"/>
  <circle cx="9"  cy="22" r="3"   fill="#60a5fa" opacity="0.85"/>
  <circle cx="14" cy="11" r="3"   fill="#60a5fa" opacity="0.85"/>

  <!-- Hub node — bright centre -->
  <circle cx="24" cy="24" r="6" fill="#1d4ed8"/>
  <circle cx="24" cy="24" r="6" fill="url(#hub-glow)" opacity="0.6"/>
  <circle cx="24" cy="24" r="4" fill="#60a5fa"/>

  <defs>
    <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>